<!doctype html>

  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // 1. Theme initialization
    (function () {
      try {
        var saved = localStorage.getItem('dotibot_theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();

    // 2. Protect Native window.fetch from polyfill corruption while allowing property assignment
    // Ensures Privy SDK always makes real native HTTPS requests to auth.privy.io
    (function () {
      try {
        var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
        if (nativeFetch) {
          var desc = {
            get: function () { return nativeFetch; },
            set: function () { /* No-op: keep native fetch intact to prevent XHR HTML fallback */ },
            configurable: true,
            enumerable: true
          };
          if (typeof Window !== 'undefined' && Window.prototype) {
            try { Object.defineProperty(Window.prototype, 'fetch', desc); } catch (e) { }
          }
          try { Object.defineProperty(window, 'fetch', desc); } catch (e) { }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try { Object.defineProperty(globalThis, 'fetch', desc); } catch (e) { }
          }
        }
      } catch (err) {
        console.warn('Native fetch protection warning:', err);
      }
    })();
  </script>
  <title>DotiBot</title>
  <meta name="description"
    content="Agentic Web3 domain registration & transfer bot on Arbitrum with Privy Twitter login and smart spending delegation." />
